receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  prometheus:
    config:
      scrape_configs:
        - job_name: canton
          scrape_interval: 15s
          static_configs:
            - targets:
                - sequencer1:10013
                - mediator1:10013
                - participant1:10013
                - participant2:10013
                - participant3:10013

processors:
  batch:

exporters:
  otlp/aspire:
    endpoint: ${env:OTEL_EXPORTER_OTLP_ENDPOINT}
    headers:
      x-otlp-api-key: ${env:ASPIRE_API_KEY}
    tls:
      insecure: true
  debug:
    verbosity: detailed

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [health_check, zpages]
  pipelines:
    metrics:
      receivers: [prometheus]
      processors: [batch]
      exporters: [debug, otlp/aspire]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlp/aspire]
