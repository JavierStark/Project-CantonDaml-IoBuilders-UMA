services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.128.0
    container_name: otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
      - "55679:55679"
    volumes:
      - ./configs/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro

  sequencer1:
    image: europe-docker.pkg.dev/da-images/public/docker/canton-sequencer:3.4.11
    container_name: sequencer1
    ports:
      - "5001:5001"
      - "5002:5002"
    volumes:
      - ./configs/sequencer-bootstrap.sc:/app/bootstrap.sc:ro
      - ./configs/shared-bootstrap.sc:/app/shared-bootstrap.sc:ro
    environment:
      - LOG_LEVEL_STDOUT=INFO
      - ADDITIONAL_CONFIG_01=canton.sequencers.sequencer.public-api.port = 5001
      - ADDITIONAL_CONFIG_02=canton.sequencers.sequencer.admin-api.port = 5002
      - ADDITIONAL_CONFIG_03=canton.sequencers.sequencer.storage.type = memory
      - ADDITIONAL_CONFIG_04=canton.sequencers.sequencer.sequencer.config.storage.type = memory
      - ADDITIONAL_CONFIG_90=canton.monitoring.tracing.propagation = enabled
      - ADDITIONAL_CONFIG_91=canton.monitoring.tracing.tracer.exporter.type = otlp
      - ADDITIONAL_CONFIG_92=canton.monitoring.tracing.tracer.exporter.address = "otel-collector"
      - ADDITIONAL_CONFIG_93=canton.monitoring.tracing.tracer.exporter.port = 4317
      - ADDITIONAL_CONFIG_94=canton.monitoring.tracing.tracer.sampler.type = trace-id-ratio
      - ADDITIONAL_CONFIG_95=canton.monitoring.tracing.tracer.sampler.ratio = 0.1
      - ADDITIONAL_CONFIG_96=canton.monitoring.tracing.tracer.sampler.parent-based = true
    depends_on:
      otel-collector:
        condition: service_started

  mediator1:
    image: europe-docker.pkg.dev/da-images/public/docker/canton-mediator:3.4.11
    container_name: mediator1
    ports:
      - "5202:5202"
    volumes:
      - ./configs/mediator-bootstrap.sc:/app/bootstrap.sc:ro
      - ./configs/shared-bootstrap.sc:/app/shared-bootstrap.sc:ro
    environment:
      - LOG_LEVEL_STDOUT=INFO
      - ADDITIONAL_CONFIG_01=canton.mediators.mediator.admin-api.port = 5202
      - ADDITIONAL_CONFIG_02=canton.mediators.mediator.storage.type = memory
      - ADDITIONAL_CONFIG_90=canton.monitoring.tracing.propagation = enabled
      - ADDITIONAL_CONFIG_91=canton.monitoring.tracing.tracer.exporter.type = otlp
      - ADDITIONAL_CONFIG_92=canton.monitoring.tracing.tracer.exporter.address = "otel-collector"
      - ADDITIONAL_CONFIG_93=canton.monitoring.tracing.tracer.exporter.port = 4317
      - ADDITIONAL_CONFIG_94=canton.monitoring.tracing.tracer.sampler.type = trace-id-ratio
      - ADDITIONAL_CONFIG_95=canton.monitoring.tracing.tracer.sampler.ratio = 0.1
      - ADDITIONAL_CONFIG_96=canton.monitoring.tracing.tracer.sampler.parent-based = true
    depends_on:
      otel-collector:
        condition: service_started

  synchronizer:
    image: europe-docker.pkg.dev/da-images/public/docker/canton-base:3.4.11
    container_name: synchronizer
    volumes:
      - ./configs/synchronizer-bootstrap.sc:/app/bootstrap.sc:ro
      - ./configs/shared-bootstrap.sc:/app/shared-bootstrap.sc:ro
    environment:
      - LOG_LEVEL_STDOUT=INFO
      - ADDITIONAL_CONFIG_01=canton.remote-sequencers.sequencer1.public-api.port = 5001
      - ADDITIONAL_CONFIG_02=canton.remote-sequencers.sequencer1.public-api.address = sequencer1
      - ADDITIONAL_CONFIG_03=canton.remote-sequencers.sequencer1.admin-api.port = 5002
      - ADDITIONAL_CONFIG_04=canton.remote-sequencers.sequencer1.admin-api.address = sequencer1
      - ADDITIONAL_CONFIG_05=canton.remote-mediators.mediator1.admin-api.port = 5202
      - ADDITIONAL_CONFIG_06=canton.remote-mediators.mediator1.admin-api.address = mediator1
      - ADDITIONAL_CONFIG_90=canton.monitoring.tracing.propagation = enabled
      - ADDITIONAL_CONFIG_91=canton.monitoring.tracing.tracer.exporter.type = otlp
      - ADDITIONAL_CONFIG_92=canton.monitoring.tracing.tracer.exporter.address = "otel-collector"
      - ADDITIONAL_CONFIG_93=canton.monitoring.tracing.tracer.exporter.port = 4317
      - ADDITIONAL_CONFIG_94=canton.monitoring.tracing.tracer.sampler.type = trace-id-ratio
      - ADDITIONAL_CONFIG_95=canton.monitoring.tracing.tracer.sampler.ratio = 0.1
      - ADDITIONAL_CONFIG_96=canton.monitoring.tracing.tracer.sampler.parent-based = true
    depends_on:
      otel-collector:
        condition: service_started
      sequencer1:
        condition: service_started
      mediator1:
        condition: service_started

  participant1:
    image: europe-docker.pkg.dev/da-images/public/docker/canton-participant:3.4.11
    container_name: participant1
    ports:
      - "5011:5011"
      - "5012:5012"
      - "5013:5013"
    volumes:
      - ./configs/participant1-bootstrap.sc:/app/bootstrap.sc:ro
      - ./configs/shared-bootstrap.sc:/app/shared-bootstrap.sc:ro
      - ./dars:/app/dars:ro
    environment:
      - LOG_LEVEL_STDOUT=INFO
      - ADDITIONAL_CONFIG_01=canton.participants.participant.admin-api.port = 5012
      - ADDITIONAL_CONFIG_02=canton.participants.participant.ledger-api.port = 5011
      - ADDITIONAL_CONFIG_03=canton.participants.participant.http-ledger-api.port = 5013
      - ADDITIONAL_CONFIG_04=canton.participants.participant.ledger-api.auth-services = []
      - ADDITIONAL_CONFIG_05=canton.participants.participant.storage.type = memory
      - ADDITIONAL_CONFIG_06=canton.participants.participant.http-ledger-api.address = 0.0.0.0
      - ADDITIONAL_CONFIG_90=canton.monitoring.tracing.propagation = enabled
      - ADDITIONAL_CONFIG_91=canton.monitoring.tracing.tracer.exporter.type = otlp
      - ADDITIONAL_CONFIG_92=canton.monitoring.tracing.tracer.exporter.address = "otel-collector"
      - ADDITIONAL_CONFIG_93=canton.monitoring.tracing.tracer.exporter.port = 4317
      - ADDITIONAL_CONFIG_94=canton.monitoring.tracing.tracer.sampler.type = trace-id-ratio
      - ADDITIONAL_CONFIG_95=canton.monitoring.tracing.tracer.sampler.ratio = 0.1
      - ADDITIONAL_CONFIG_96=canton.monitoring.tracing.tracer.sampler.parent-based = true
      
    depends_on:
      synchronizer:
        condition: service_started

  participant2:
    image: europe-docker.pkg.dev/da-images/public/docker/canton-participant:3.4.11
    container_name: participant2
    ports:
      - "5021:5021"
      - "5022:5022"
      - "5023:5023"
    volumes:
      - ./configs/participant2-bootstrap.sc:/app/bootstrap.sc:ro
      - ./configs/shared-bootstrap.sc:/app/shared-bootstrap.sc:ro
      - ./dars:/app/dars:ro
    environment:
      - LOG_LEVEL_STDOUT=INFO
      - ADDITIONAL_CONFIG_01=canton.participants.participant.admin-api.port = 5022
      - ADDITIONAL_CONFIG_02=canton.participants.participant.ledger-api.port = 5021
      - ADDITIONAL_CONFIG_03=canton.participants.participant.http-ledger-api.port = 5023
      - ADDITIONAL_CONFIG_04=canton.participants.participant.ledger-api.auth-services = []
      - ADDITIONAL_CONFIG_05=canton.participants.participant.storage.type = memory
      - ADDITIONAL_CONFIG_06=canton.participants.participant.http-ledger-api.address = 0.0.0.0
      - ADDITIONAL_CONFIG_90=canton.monitoring.tracing.propagation = enabled
      - ADDITIONAL_CONFIG_91=canton.monitoring.tracing.tracer.exporter.type = otlp
      - ADDITIONAL_CONFIG_92=canton.monitoring.tracing.tracer.exporter.address = "otel-collector"
      - ADDITIONAL_CONFIG_93=canton.monitoring.tracing.tracer.exporter.port = 4317
      - ADDITIONAL_CONFIG_94=canton.monitoring.tracing.tracer.sampler.type = trace-id-ratio
      - ADDITIONAL_CONFIG_95=canton.monitoring.tracing.tracer.sampler.ratio = 0.1
      - ADDITIONAL_CONFIG_96=canton.monitoring.tracing.tracer.sampler.parent-based = true
    depends_on:
      synchronizer:
        condition: service_started

  participant3:
    image: europe-docker.pkg.dev/da-images/public/docker/canton-participant:3.4.11
    container_name: participant3
    ports:
      - "5031:5031"
      - "5032:5032"
      - "5033:5033"
    volumes:
      - ./configs/participant3-bootstrap.sc:/app/bootstrap.sc:ro
      - ./configs/shared-bootstrap.sc:/app/shared-bootstrap.sc:ro
      - ./dars:/app/dars:ro
    environment:
      - LOG_LEVEL_STDOUT=INFO
      - ADDITIONAL_CONFIG_01=canton.participants.participant.admin-api.port = 5032
      - ADDITIONAL_CONFIG_02=canton.participants.participant.ledger-api.port = 5031
      - ADDITIONAL_CONFIG_03=canton.participants.participant.http-ledger-api.port = 5033
      - ADDITIONAL_CONFIG_04=canton.participants.participant.ledger-api.auth-services = []
      - ADDITIONAL_CONFIG_05=canton.participants.participant.storage.type = memory
      - ADDITIONAL_CONFIG_06=canton.participants.participant.http-ledger-api.address = 0.0.0.0
      - ADDITIONAL_CONFIG_90=canton.monitoring.tracing.propagation = enabled
      - ADDITIONAL_CONFIG_91=canton.monitoring.tracing.tracer.exporter.type = otlp
      - ADDITIONAL_CONFIG_92=canton.monitoring.tracing.tracer.exporter.address = "otel-collector"
      - ADDITIONAL_CONFIG_93=canton.monitoring.tracing.tracer.exporter.port = 4317
      - ADDITIONAL_CONFIG_94=canton.monitoring.tracing.tracer.sampler.type = trace-id-ratio
      - ADDITIONAL_CONFIG_95=canton.monitoring.tracing.tracer.sampler.ratio = 0.1
      - ADDITIONAL_CONFIG_96=canton.monitoring.tracing.tracer.sampler.parent-based = true
    depends_on:
      synchronizer:
        condition: service_started

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: bond-backend
    ports:
      - "8080:8080"
    environment:
      - HTTP_HOST=0.0.0.0
      - HTTP_PORT=8080
      - LEDGER_TRANSPORT=grpc
      - CANTON_USER_ID=ledger-api-user
      - REQUEST_TIMEOUT=30s
      - PARTICIPANT1_URL=http://participant1:5013
      - PARTICIPANT1_GRPC_URL=participant1:5011
      - PARTICIPANT1_PARTIES=admin,alice,executor
      - PARTICIPANT2_URL=http://participant2:5023
      - PARTICIPANT2_GRPC_URL=participant2:5021
      - PARTICIPANT2_PARTIES=bob
      - PARTICIPANT3_URL=http://participant3:5033
      - PARTICIPANT3_GRPC_URL=participant3:5031
      - PARTICIPANT3_PARTIES=charlie
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - OTEL_SERVICE_NAME=backend
    depends_on:
      otel-collector:
        condition: service_started
      participant1:
        condition: service_started
      participant2:
        condition: service_started
      participant3:
        condition: service_started
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bond-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: on-failure

  listener:
    build:
      context: .
      dockerfile: listener/Dockerfile
    container_name: bond-listener
    ports:
      - "8081:8081" 
    environment:
      - LISTENER_PARTICIPANT_URL=participant1:5011
      - LISTENER_HTTP_URL=http://participant1:5013
      - LISTENER_PARTY=admin
      - LISTENER_EMIT_INITIAL=false
    depends_on:
      participant1:
        condition: service_started
      participant2:
        condition: service_started
      participant3:
        condition: service_started
    restart: on-failure
